name: Check Ruby Versions
on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruby-version-check
  cancel-in-progress: false

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update versions.yml
        id: update
        run: |
          python3 scripts/update-ruby-versions.py | tee version-update-summary.txt

          if git diff --quiet -- versions.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require bot token
        if: steps.update.outputs.changed == 'true'
        env:
          BOT_PUBLIC_GITHUB_TOKEN: ${{ secrets.BOT_PUBLIC_GITHUB_TOKEN }}
        run: |
          if [ -z "${BOT_PUBLIC_GITHUB_TOKEN}" ]; then
            echo "BOT_PUBLIC_GITHUB_TOKEN is required to open the Ruby version update PR." >&2
            exit 1
          fi

      - name: Create version update PR
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BOT_PUBLIC_GITHUB_TOKEN }}
          commit-message: "chore: update Ruby versions"
          committer: "boringcache-bot <boringcache-bot@users.noreply.github.com>"
          author: "boringcache-bot <boringcache-bot@users.noreply.github.com>"
          title: "chore: update Ruby versions"
          body-path: version-update-summary.txt
          branch: auto/ruby-version-bump
          delete-branch: true
